<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#222222">
<link rel="manifest" href="manifest.json">
<title>Absensi Mingguan</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}
header{background:#222;color:#fff;padding:18px;text-align:center}h1{margin:0;font-size:23px}
main{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font-size:16px;padding:11px;border-radius:9px;border:1px solid #ccc}
input{flex:1;min-width:160px}button{background:#222;color:#fff;border:0}button.red{background:#b3261e}
.table{overflow:auto}table{width:100%;min-width:650px;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;text-align:center}th{background:#eee}
.name{text-align:left;font-weight:bold}.check{width:40px;height:38px;padding:0;background:#eee;color:#222}.check.on{background:#222;color:#fff}
.del{padding:6px 9px;font-size:13px;background:#b3261e}.info{font-size:14px;color:#666}
</style>
</head>
<body>
<header><h1>📋 ABSENSI MINGGUAN</h1></header>
<main>
<section class="card">
 <div class="row">
  <input id="week" type="date">
  <input id="name" placeholder="Nama orang">
  <button id="add">+ Tambah Nama</button>
 </div>
 <p class="info">Pilih tanggal pada minggu yang diinginkan. Tekan ✓ untuk menandai hadir.</p>
 <div class="row">
  <button id="install" style="display:none">📲 Pasang Aplikasi</button>
  <button id="export">⬇ Export CSV</button>
  <button class="red" id="reset">Reset Minggu</button>
 </div>
</section>
<section class="card table">
<table><thead><tr><th>No</th><th>Nama</th><th>Sen</th><th>Sel</th><th>Rab</th><th>Kam</th><th>Jum</th><th>Sab</th><th>Min</th><th></th></tr></thead>
<tbody id="body"></tbody></table>
</section>
</main>
<script>
const KEY="absensi_mingguan_pwa";
let db=JSON.parse(localStorage.getItem(KEY)||'{"people":[],"weeks":{}}');
const $=id=>document.getElementById(id);
function monday(v){let d=new Date((v||new Date().toISOString().slice(0,10))+"T12:00:00"),day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return d.toISOString().slice(0,10)}
function week(){return monday($("week").value)}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function render(){
 const w=week(), rec=db.weeks[w]||{}, body=$("body"); body.innerHTML="";
 if(!db.people.length){body.innerHTML='<tr><td colspan="10">Belum ada nama.</td></tr>';return}
 db.people.forEach((n,i)=>{
  const tr=document.createElement("tr");tr.innerHTML=`<td>${i+1}</td><td class="name"></td>`;tr.children[1].textContent=n;
  const a=rec[i]||Array(7).fill(false);
  for(let d=0;d<7;d++){let td=document.createElement("td"),b=document.createElement("button");b.className="check"+(a[d]?" on":"");b.textContent=a[d]?"✓":"—";b.onclick=()=>{db.weeks[w]??={};db.weeks[w][i]??=Array(7).fill(false);db.weeks[w][i][d]=!db.weeks[w][i][d];save()};td.appendChild(b);tr.appendChild(td)}
  let td=document.createElement("td"),b=document.createElement("button");b.className="del";b.textContent="Hapus";b.onclick=()=>{if(confirm("Hapus nama ini?")){db.people.splice(i,1);delete db.weeks[w]?.[i];save()}};td.appendChild(b);tr.appendChild(td);body.appendChild(tr)
 })
}
$("week").value=monday();$("week").onchange=()=>{$("week").value=week();render()};
$("add").onclick=()=>{let n=$("name").value.trim();if(!n)return;if(db.people.includes(n)){alert("Nama sudah ada.");return}db.people.push(n);$("name").value="";save()};
$("reset").onclick=()=>{if(confirm("Hapus tanda hadir minggu ini?")){delete db.weeks[week()];save()}};
$("export").onclick=()=>{let r=db.weeks[week()]||{},rows=[["Nama","Sen","Sel","Rab","Kam","Jum","Sab","Min"],...db.people.map((n,i)=>[n,...(r[i]||Array(7).fill(false)).map(x=>x?"Hadir":"")])];let csv=rows.map(x=>x.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="absensi-"+week()+".csv";a.click()};
let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("install").style.display="block"});$("install").onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
render();
</script>
</body></html>
